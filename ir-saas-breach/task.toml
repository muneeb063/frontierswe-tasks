schema_version = "1.3"

[[artifacts]]
source = "/workspace/output"

[task]
name = "rlabs/ir-saas-breach"
description = "Reconstruct a SaaS account-takeover and data-exfiltration incident from web, application and cloud audit logs, separating the intrusion from authorized and benign look-alike activity."
keywords = ["incident-response", "forensics", "log-analysis", "cloud-security", "password-spraying", "exfiltration"]

[metadata]
difficulty = "hard"
category = "security"
oracle_reward_threshold = 0

[agent]
timeout_sec = 72000.0
user = "agent"

[verifier]
timeout_sec = 300.0

[verifier.env]

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 4096
network_mode = "no-network"
