schema_version = "1.3"

[[artifacts]]
source = "/workspace/iam"

[task]
name = "rlabs/iam-policy-engine"
description = "Implement a cloud IAM authorization engine (identity, boundary, organization and resource policies; wildcards, variables, condition operators, cross-account rules) from a written spec; scored on hidden accounts and access requests."
keywords = ["cloud-security", "iam", "authorization", "policy-evaluation", "access-control", "spec-implementation"]

[metadata]
difficulty = "hard"
category = "security"
oracle_reward_threshold = 0

[agent]
timeout_sec = 72000.0
user = "agent"

[verifier]
timeout_sec = 900.0

[verifier.env]

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
network_mode = "no-network"
