schema_version = "1.3"

[[artifacts]]
source = "/workspace/quill"

[task]
name = "rlabs/quill-interpreter"
description = "Implement a complete interpreter for Quill, a small dynamically typed language with closures, bigints, maps and exact error semantics, from a written spec; scored on hidden programs."
keywords = ["interpreter", "programming-languages", "parsing", "closures", "bigint", "spec-implementation"]

[metadata]
difficulty = "hard"
category = "software-engineering"
oracle_reward_threshold = 0

[agent]
timeout_sec = 72000.0
user = "agent"

[verifier]
# 75 hidden programs, each capped at 10 s.
timeout_sec = 900.0

[verifier.env]

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
network_mode = "no-network"
